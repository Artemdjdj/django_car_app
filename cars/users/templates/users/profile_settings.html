{% extends "layouts/base.html" %}
{% load static %}

{% block css %}
<link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fjalla+One&family=Playwrite+VN:wght@100..400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock css %}


{% block header %}
{% endblock header %}

{% block content %}
    <div class="row">
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-9 bg-white p-4 mb-5 mx-2 rounded custom-shadow">
            <h2 class="text-center mb-4">Информация пользователя</h2>
            <form action="{% url 'user:profile' %}" method="post">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="id_username" class="form-label">Имя профиля</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_username"
                    placeholder="Введите имя профиля"
                    name="username"
                    value = "{{form.username.value}}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="id_first_name" class="form-label">Имя</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_first_name"
                    placeholder="Введите имя"
                    name="first_name"
                    value = "{{form.first_name.value}}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="id_last_name" class="form-label">Фамилия</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_last_name"
                    placeholder="Введите фамилию"
                    name="last_name"
                    value = "{{form.last_name.value}}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="id_phone" class="form-label">Номер телефона</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_phone"
                    placeholder="Введите номер телефона"
                    name="phone"
                    value = "{{form.phone.value}}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Адрес электронной почты</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_email"
                    placeholder="Введите адрес электронной почты"
                    name="email"
                    value = "{{form.email.value}}"
                  />
                </div>
                <!-- <div class="col-md-6 mb-3">
                  <label for="id_password" class="form-label">Пароль</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id_password"
                    placeholder="Введите пароль"
                    name="password"
                  />
                </div> -->
            </div>
              <button type="submit" class="btn btn-success">
                Изменить
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
{% endblock content %}


{% block footer %}
{% endblock footer %}
