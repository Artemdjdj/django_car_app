{% extends "layouts/base.html" %}
{% load static %}

{% block css %}
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fjalla+One&family=Playwrite+VN:wght@100..400&display=swap"
    rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/find_car.css' %}">
<link rel="stylesheet" href="{% static 'css/main.css' %}" >
{% endblock css %}

{% block header %}
{% endblock header %}

{% block content %}

<div class="row">
    <div class="container mt-5">
        <div class="row justify-content-center">
           <div class="col-md-9 bg-dark text-light p-4 mb-5 mx-2 rounded custom-shadow">
                <h2 class="text-center mb-4">Добавление изображения</h2>
                <form action="{% url 'car:add_car_image' type_of_car_slug car_slug %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="file" class="form-control" id="image" name="image">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="is_main">
                            <input type="checkbox" class="form-check-input" id="is_main" name="is_main"> Главное фото
                        </label>
                    </div>

                    <div class ="send_button">
                        <button type="submit" class="btn btn-outline-success" name="action" value="save">Сохранить</button>
                        <button type="submit" class="btn btn-outline-info" name="action" value="save_and_next">Сохранить и добавить следующую</button>
                    </div>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block footer %}
{% endblock footer %}
